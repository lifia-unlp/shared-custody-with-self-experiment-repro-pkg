[project]
name = "shared-custody-repro"
description = "Reproduction package for the Shared-custody with Self usability experiment"
license = "CC-BY-4.0"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pingouin>=0.6.1",
]
